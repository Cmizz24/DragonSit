<!doctype html><html><head><meta charset="utf-8"><style>body{background:#22303f;font-family:sans-serif;color:#fff;margin:0;padding:6px}.grid{display:flex;flex-wrap:wrap;gap:2px}.c{width:146px;text-align:center;font-size:10px}.c svg{width:146px;height:146px}</style></head><body>
<div id="grid" class="grid"></div>
<script type="module">
import { dragonSVG } from '../src/art/dragon.js';
import { DRAGON_LIST } from '../src/data/dragons.js';
const g = document.getElementById('grid');
for (const d of DRAGON_LIST) g.innerHTML += `<div class="c">${dragonSVG(d.id,'adult',{size:146})}<div>${d.name.replace(' Dragon','')}</div></div>`;
window.__done = true;
</script></body></html>
